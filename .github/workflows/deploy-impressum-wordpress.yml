name: Deploy Impressum to WordPress

on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract page content from impressum.html
        run: |
          python3 - <<'PY'
          import re
          html = open("impressum.html", encoding="utf-8").read()
          style = re.search(r"<style>.*?</style>", html, re.S).group(0)
          body = re.search(r"<body>(.*)</body>", html, re.S).group(1)
          open("page_content.html", "w", encoding="utf-8").write(style + "\n" + body)
          PY

      - name: Create or update the WordPress page via REST API
        env:
          WP_BASE: https://www.solaero.gmbh
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          set -euo pipefail
          AUTH="$WP_USER:$WP_APP_PASSWORD"
          CONTENT=$(jq -Rs . < page_content.html)

          GET_RESP=$(curl -sS -w '\n%{http_code}' -u "$AUTH" "$WP_BASE/wp-json/wp/v2/pages?slug=impressum&status=any")
          GET_CODE=$(echo "$GET_RESP" | tail -n1)
          GET_BODY=$(echo "$GET_RESP" | sed '$d')
          echo "GET status: $GET_CODE"
          echo "GET body: $GET_BODY"

          if [ "$GET_CODE" != "200" ]; then
            echo "::error::Failed to query existing page (HTTP $GET_CODE)"
            exit 1
          fi

          EXISTING_ID=$(echo "$GET_BODY" | jq -r '.[0].id // empty')

          PAYLOAD=$(jq -n --arg title "Impressum" --arg slug "impressum" --argjson content "$CONTENT" \
            '{title: $title, slug: $slug, status: "publish", content: $content}')

          if [ -n "$EXISTING_ID" ]; then
            URL="$WP_BASE/wp-json/wp/v2/pages/$EXISTING_ID"
            echo "Updating existing page id=$EXISTING_ID"
          else
            URL="$WP_BASE/wp-json/wp/v2/pages"
            echo "Creating new page"
          fi

          RESP=$(curl -sS -w '\n%{http_code}' -u "$AUTH" -X POST "$URL" \
            -H "Content-Type: application/json" -d "$PAYLOAD")
          CODE=$(echo "$RESP" | tail -n1)
          BODY=$(echo "$RESP" | sed '$d')
          echo "POST status: $CODE"
          echo "$BODY" | jq '.'

          if [ "$CODE" -ge 300 ]; then
            echo "::error::WordPress API returned HTTP $CODE"
            exit 1
          fi
